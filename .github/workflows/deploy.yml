name: Deploy to GitHub pages

on:
    # Publishing remains an explicit action: routine pushes do not deploy.
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build web with PreTeXt
              uses: siefkenj/pretext-build-action@main
              with:
                  pretext-command: build web
                  project-root: "."
                  output-dir: "."

            - name: Publish built site to gh-pages
              uses: siefkenj/pretext-build-action@main
              with:
                  pretext-command: deploy
                  project-root: "."
                  output-dir: "."
