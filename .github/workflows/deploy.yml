name: Deploy to GitHub pages

on:
    # Publishing remains an explicit action: routine pushes do not deploy.
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build web with PreTeXt
              uses: siefkenj/pretext-build-action@main
              with:
                  pretext-command: build web
                  project-root: "."
                  output-dir: "."

            - name: Stage site with PreTeXt
              uses: siefkenj/pretext-build-action@main
              with:
                  pretext-command: deploy --stage-only
                  project-root: "."
                  output-dir: "."

            - name: Publish staged site to gh-pages
              shell: bash
              run: |
                  git worktree add --detach /tmp/gh-pages origin/gh-pages
                  rsync --archive --delete --exclude=.git output/stage/ /tmp/gh-pages/
                  touch /tmp/gh-pages/.nojekyll
                  cd /tmp/gh-pages
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add --all
                  if git diff --cached --quiet; then
                      echo "The generated website is already up to date."
                      exit 0
                  fi
                  git commit -m "Latest build deployed."
                  git push origin HEAD:gh-pages
