<article class="theorem theorem-like"><h4 class="heading">
<span class="type">Theorem</span><span class="space"> </span><span class="codenumber">7.3</span><span class="space"> </span><span class="creator">(Maclaurin)</span><span class="period">.</span>
</h4>
<div class="para logical">
<div class="para">Let <span class="process-math">\(I\)</span> be an open interval, and suppose that the power series <a href="Chap-Calculus_1.html#eq-fx-power-series" class="xref" data-knowl="./knowl/xref/eq-fx-power-series.html" data-reveal-label="Reveal" data-close-label="Close" title="Equation 7.4">(7.4)</a> converges to <span class="process-math">\(f(x)\)</span> for <span class="process-math">\(x\in I\text{.}\)</span> Then, for <span class="process-math">\(x\in I\text{,}\)</span>
</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/eq-fx-power-series.html">
\begin{equation}
f(x) = \sum_{k=0}^{\infty} \frac{f^{(k)}(0)}{k!}x^k.\tag{7.5}
\end{equation}
</div>
